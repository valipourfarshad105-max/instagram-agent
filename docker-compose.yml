services:
  agent:
    build: .
    container_name: ig-agent
    restart: unless-stopped
    env_file: .env
    command: python -m agent.cli schedule
    volumes:
      - ./out:/app/out
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
      - ./assets:/app/assets
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  dashboard:
    build: .
    container_name: ig-dashboard
    restart: unless-stopped
    env_file: .env
    command: python -m agent.cli dashboard
    ports:
      - "8000:8000"
    volumes:
      - ./out:/app/out
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
      - ./assets:/app/assets
